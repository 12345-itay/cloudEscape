name: AWS Access

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

  
jobs:
  aws:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

          
        # 1. Inspect Security Groups  
      - name: Describe Security Groups
        run: |
          echo "=== Security Groups Configuration ==="
          aws ec2 describe-security-groups --region us-east-1

      # 2. Inspect Route Tables
      - name: Describe Route Tables
        run: |
          echo "=== Route Tables & Gateway Routes ==="
          aws ec2 describe-route-tables --region us-east-1

      # 3. Inspect VPC Peering Connections
      - name: Describe VPC Peering Connections
        run: |
          echo "=== VPC Peering Connections ==="
          aws ec2 describe-vpc-peering-connections --region us-east-1

      # 4. Inspect VPC Endpoints (e.g., S3 Gateway Endpoints)
      - name: Describe VPC Endpoints
        run: |
          echo "=== VPC Endpoints ==="
          aws ec2 describe-vpc-endpoints --region us-east-1