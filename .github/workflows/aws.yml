name: AWS Access

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read


jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Investigate buckets and CloudFront
        run: |
          aws s3api list-objects-v2 --bucket site781fe43f26b9eba3 --output json
          aws cloudfront get-distribution --id d4ysu55xg7wfi
          aws s3api get-bucket-policy --bucket site781fe43f26b9eba3
          aws s3api list-objects-v2 --bucket user6dcaf1b8c9fd6612 --output json
          aws s3api list-objects-v2 --bucket log6dcaf1b8c9fd6612 --output json