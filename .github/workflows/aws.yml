name: AWS Access

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read


jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Investigate with challenge credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws lambda update-function-configuration --function-name code_exec --timeout 900 --region us-east-1