name: AWS Access

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

  
jobs:
  aws:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1


      - name: Test API Gateway endpoints
        run: |
          for stage in prod dev test v1; do
            echo "Testing stage: $stage"
            curl -i \
            "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/$stage"
          done