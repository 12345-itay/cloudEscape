name: AWS Access

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read


jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Investigate with challenge credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws sts get-caller-identity
          aws s3api list-objects-v2 --bucket site781fe43f26b9eba3 --output json
          aws s3api list-objects-v2 --bucket user6dcaf1b8c9fd6612 --output json
          aws s3api list-objects-v2 --bucket log6dcaf1b8c9fd6612 --output json
          aws cloudfront get-distribution --id d4ysu55xg7wfi