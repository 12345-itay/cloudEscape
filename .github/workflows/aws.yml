name: AWS Access

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

  
jobs:
  aws:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Read all objects from all S3 buckets
        run: |
          for bucket in $(aws s3api list-buckets --query "Buckets[].Name" --output text); do
            echo "=== Bucket: $bucket ==="
            for key in $(aws s3api list-objects-v2 --bucket "$bucket" --query "Contents[].Key" --output text 2>/dev/null); do
              echo "--- Object: $key ---"
              echo ""
            done
          done