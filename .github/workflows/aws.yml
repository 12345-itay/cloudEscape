name: AWS Access

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

  
jobs:
  aws:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Download objects
        run: |
          aws s3 cp s3://codec4f26c862a321ef5/code.zip .
          aws s3 cp s3://codec4f26c862a321ef5/flag.txt .

      - name: Show flag
        run: cat flag.txt

      - name: Inspect ZIP contents
        run: unzip -l code.zip